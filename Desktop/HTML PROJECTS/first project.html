<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="nav">
            <div class="nav-part-1">
                <img src="image.png" alt="Logo">
                <ul>
                  <li>Home</li>
                  <li>Men</li>
                  <li>Women</li>
                  <li>Collection</li>
                  <li>Contact</li>
                </ul>
            </div>
            <div class="nav-part-2">
            <i class="ri-search-line"></i>
            <i class="ri-shopping-cart-2-line"></i>
            <i class="ri-menu-line"></i>
            </div>
        </div>
        <div class="content">
            <div class="content-left">
                <h5>Explore limited  edition</h5>
                <h1>Nike limited <br> edition</h1>
                <p class="para">Unleash the extraordinary. Elevate your game with Nike's Limited Edition. Where innovation meets style, leaving a lasting mark. Just do it. </p>
                <button class="btn" >Shop Now</button>
            </div>
            <div class="content-right">
                <div class="product">
                    <img class="image1" src="nike2.png" alt="nike shoes">
                    <h4>Nike Air max</h4>
                    <p class="catagory">Men's shoes</p>
                    <p class="color">color:white</p>
                    <p class="price">$ 14 995</p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
